# Roster-form battle (roadmap 3e): two 6-hero rosters drafted to 4 each by rules.draft.steps (variant C), on the defender's battlefield,
# City (terrain_005). Generic heroes char_005..char_014 plus Lief and The Emperor on the defender side.
# Expected draft: 1. challenger bans Lief (the defender's top leader-line hero, so the Monster, next in line and the anchor, leads with its own
# squad and aura); 2. the defender's rule 1 bans the challenger's Holy; 3. challenger protects its Infantry; 4. challenger bans the Mage;
# 5. rule 1 already fired and rule 2 (mage) matches nobody, so the fallback bans the challenger's highest-cost eligible hero.
# The challenger edits between phases (design 5.5): phase 2 reorders the Infantry's sheet and moves its squad back; phase 3 names the
# Flyer as leader instead of the Archer (next in the leader line), which only applies if the Infantry died.
# Devotion sigils (Section 9A): challenger Infantry 4 Jurojin (Full Moon 4-piece), Cavalry 2 Hotei (Breeze 2-piece); defender Monster 4 Daikokuten
# (Gift 4-piece), Lancer 2 Bishamonten + 2 Hotei (Plate and Breeze 2-piece).
battle_id: draft_city
version: "1"
seeds: [5, 55, 555]

challenger:
  draft:
    bans: [char_004, char_010]   # steps 1 and 4
    protects: [char_005]         # step 3
  edits:
    - phase: 2
      heroes:
        - char_id: char_005
          squad_row: back
          tactic_sheet:
            - { priority: 1, skill_id: skl_001, enabled: true, activation: null, targeting: { main: null, sub: null }, fallback: skip }   # Strike
            - { priority: 2, skill_id: skl_004, enabled: true, activation: null, targeting: { main: null, sub: null }, fallback: skip }   # Cleave
            - { priority: 3, skill_id: skl_020, enabled: true, activation: null, targeting: { main: null, sub: null }, fallback: skip }   # Counter (passive)
    - phase: 3
      leader: char_009   # skips the Archer
  roster:
    roster_id: challenger_city
    version: "1"
    leader_line: [char_005, char_012, char_007, char_008, char_009, char_013]
    anchor: null
    ban_sheet: null
    heroes:
      - char_id: char_005   # Infantry
        squad_id: soldier_003
        equipment: { weapon: equip_009, armor: equip_018, accessory_1: equip_020, accessory_2: equip_021 }
        sigils: { weapon: god_002, armor: god_002, accessory_1: god_002, accessory_2: god_002 }   # Full Moon 4-piece
        tactic_sheet:
          - { priority: 1, skill_id: skl_004, enabled: true, activation: null, targeting: { main: null, sub: null }, fallback: skip }   # Cleave
          - { priority: 2, skill_id: skl_001, enabled: true, activation: null, targeting: { main: null, sub: null }, fallback: skip }   # Strike
          - { priority: 3, skill_id: skl_020, enabled: true, activation: null, targeting: { main: null, sub: null }, fallback: skip }   # Counter (passive)
      - char_id: char_012   # Holy
        squad_id: soldier_009
        equipment: { weapon: equip_011, armor: equip_019, accessory_1: null, accessory_2: null }
        tactic_sheet:
          - { priority: 1, skill_id: skl_013, enabled: true, activation: null, targeting: { main: null, sub: null }, fallback: skip }   # Blessing
          - { priority: 2, skill_id: skl_012, enabled: true, activation: null, targeting: { main: null, sub: { select: lowest, metric: hp_percent, side: ally } }, fallback: skip }   # Mend
          - { priority: 3, skill_id: skl_003, enabled: true, activation: null, targeting: { main: null, sub: null }, fallback: skip }   # Bolt
          - { priority: 4, skill_id: skl_passive_003, enabled: true, activation: null, targeting: { main: null, sub: null }, fallback: skip }   # Quick Heal (passive)
      - char_id: char_007   # Cavalry
        squad_id: soldier_005
        equipment: { weapon: equip_010, armor: equip_018, accessory_1: null, accessory_2: null }
        sigils: { weapon: god_005, armor: god_005 }   # Breeze 2-piece
        tactic_sheet:
          - { priority: 1, skill_id: skl_006, enabled: true, activation: null, targeting: { main: null, sub: null }, fallback: skip }   # Charge
          - { priority: 2, skill_id: skl_001, enabled: true, activation: null, targeting: { main: null, sub: null }, fallback: skip }   # Strike
          - { priority: 3, skill_id: skl_018, enabled: true, activation: null, targeting: { main: null, sub: null }, fallback: skip }   # Follow-Up (passive)
      - char_id: char_008   # Archer
        squad_id: soldier_006
        equipment: { weapon: equip_012, armor: equip_017, accessory_1: null, accessory_2: null }
        tactic_sheet:
          - { priority: 1, skill_id: skl_007, enabled: true, activation: null, targeting: { main: null, sub: null }, fallback: skip }   # Volley
          - { priority: 2, skill_id: skl_002, enabled: true, activation: null, targeting: { main: null, sub: null }, fallback: skip }   # Shot
          - { priority: 3, skill_id: skl_passive_001, enabled: true, activation: null, targeting: { main: null, sub: null }, fallback: skip }   # Quick Guard (passive)
          - { priority: 4, skill_id: skl_019, enabled: true, activation: null, targeting: { main: null, sub: null }, fallback: skip }   # Pursuit (passive)
      - char_id: char_009   # Flyer
        squad_id: soldier_007
        equipment: { weapon: null, armor: equip_017, accessory_1: null, accessory_2: null }
        tactic_sheet:
          - { priority: 1, skill_id: skl_008, enabled: true, activation: null, targeting: { main: null, sub: null }, fallback: skip }   # Dive
          - { priority: 2, skill_id: skl_001, enabled: true, activation: null, targeting: { main: null, sub: null }, fallback: skip }   # Strike
          - { priority: 3, skill_id: skl_passive_001, enabled: true, activation: null, targeting: { main: null, sub: null }, fallback: skip }   # Quick Guard (passive)
          - { priority: 4, skill_id: skl_019, enabled: true, activation: null, targeting: { main: null, sub: null }, fallback: skip }   # Pursuit (passive)
      - char_id: char_013   # Aquatic
        squad_id: soldier_011
        equipment: { weapon: null, armor: null, accessory_1: null, accessory_2: null }
        tactic_sheet:
          - { priority: 1, skill_id: skl_015, enabled: true, activation: null, targeting: { main: null, sub: null }, fallback: skip }   # Tidal Crash
          - { priority: 2, skill_id: skl_001, enabled: true, activation: null, targeting: { main: null, sub: null }, fallback: skip }   # Strike
          - { priority: 3, skill_id: skl_020, enabled: true, activation: null, targeting: { main: null, sub: null }, fallback: skip }   # Counter (passive)

