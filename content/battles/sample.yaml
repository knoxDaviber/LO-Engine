# Sample battle: 2v2 heroes in plain shop gear (no signature items, so balance reads stay clean). Only each leader's squad (soldier_001, Heavy Infantry, default front soldier row) is deployed.
battle_id: sample_2v2
version: "1"
seeds: [101, 202, 303]   # one per phase

challenger:
  leader: char_001
  heroes:
    - char_id: char_001   # Leon
      squad_id: soldier_001
      equipment: { weapon: equip_010, armor: equip_018, accessory_1: equip_008, accessory_2: equip_023 }   # spear, plate, gloves, boots
      tactic_sheet:
        - priority: 1
          skill_id: skl_cav_active_002   # Thousand Azure Hooves
          enabled: true
          main: null
          sub: null
        - priority: 2
          skill_id: skl_cav_active_001   # Charging Assault
          enabled: true
          main: null
          sub: null
    - char_id: char_004   # Lief
      squad_id: soldier_001
      equipment: { weapon: equip_010, armor: equip_017, accessory_1: equip_008, accessory_2: equip_027 }   # spear, leather, gloves, belt
      tactic_sheet:
        - priority: 1
          skill_id: skl_lancer_active_002   # Defensive Strike
          enabled: true
          main: null
          sub: null
        - priority: 2
          skill_id: skl_lancer_active_001   # Vine Stab
          enabled: true
          main: null
          sub: null

defender:
  leader: char_002
  heroes:
    - char_id: char_002   # The Emperor
      squad_id: soldier_001
      equipment: { weapon: equip_009, armor: equip_018, accessory_1: equip_024, accessory_2: equip_027 }   # sword, plate, bracelet, belt
      tactic_sheet:
        - priority: 1
          skill_id: skl_inf_active_002   # Dark Dragon's Dirge
          enabled: true
          main: null
          sub: null
        - priority: 2
          skill_id: skl_inf_active_001   # Iron Fist
          enabled: true
          main: null
          sub: null
    - char_id: char_003   # Jasmine
      squad_id: soldier_001
      equipment: { weapon: equip_011, armor: equip_019, accessory_1: equip_021, accessory_2: equip_022 }   # staff, robe, amulet, charm
      tactic_sheet:
        - priority: 1
          skill_id: skl_heal_active_001   # Last Chance
          enabled: true
          main: null
          sub: { select: lowest, metric: hp_percent }
