  passive_effects:
    - name: null
      target: self_squad
      effects:
        - { type: modify_stat, stat: ATK, mode: percent, value: 30, source_category: soldier }
        - { type: modify_stat, stat: DEF, mode: percent, value: 30, source_category: soldier }
  eligible_heroes: []
  eligible_classes: []
  designer_notes: { strengths: "", weaknesses: "", synergies: "Pairs with Leon without his SPD penalty." }
  meta:
