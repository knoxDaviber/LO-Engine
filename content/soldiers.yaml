    SPD: 50
    HIT: 60                           # not given; kept at Heavy Infantry's value
    SKL: 30                           # not given; kept at Heavy Infantry's value
    CRIT: 15
    GUARD: 0
    EVA: 10
  basic_attack:
    damage_type: physical
    range: melee
    scaling: [{ stat: ATK, coef: 1.0 }]
