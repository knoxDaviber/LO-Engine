# rules.yaml: every tunable constant in one place. The engine and validator read this; nothing is hard-coded elsewhere.
# Values marked "placeholder" are expected to change after batch-simulator testing.

# Damage base step (power = coef * stat * multiplier * matchup vs the defender's defense); crit, guard, reductions and min_damage come after,
# unchanged by the formula. No variance. [DEFAULT] subtract until the designer chooses (compare with: npm run batch -- ... --formula=...).
#   subtract         base = max(min_damage, power - defense)
#   ratio            base = max(min_damage, power * ratio_k / (ratio_k + defense))           defense ratio_k halves the damage
#   scaled_subtract  base = max(min_damage, power * floor_pct / 100, power - defense * def_weight)   never below floor_pct of power
damage:   { min_damage: 1, crit_multiplier: 1.5, formula: subtract, ratio_k: 100, floor_pct: 20, def_weight: 1 }
guard:    { damage_reduction_percent: 50, total_reduction_cap_percent: 75 }
matchup:  { advantage_damage_percent: 25, advantage_hit: 10, disadvantage_damage_percent: -15 }
timeline: { interval_constant: 1000, min_spd: 5 }                                  # interval = round(constant / max(SPD, min_spd))
pp:       { base_active: 2, base_passive: 2, max: 4 }
board:    { rows: 4, columns: 3, hero_rows: 2 }
stun_pushback_counts: 15            # [DEFAULT] timeline counts a stunned unit's pending action is pushed back (delays_pending_action); a typical interval is ~20-27 counts, so a stun costs a bit over half an action

# hit%   = clamp(HIT + hit_bonus - EVA + (aSKL - dSKL) / skl_divisor, hit_min, hit_max)
# crit%  = clamp(CRIT - defender GUARD + (aSKL - dSKL) / skl_divisor, crit_min, crit_max)
# guard% = clamp(GUARD + dSKL / skl_divisor, guard_min, guard_max)
rolls:    { hit_min: 70, hit_max: 100, crit_min: 0, crit_max: 100, guard_min: 0, guard_max: 75, skl_divisor: 4 }

class_traits: { flyer_melee_eva_bonus: 50, aquatic_water_spd_bonus: 30 }   # percent (Decision 126): flyer EVA x1.5 vs melee hits; aquatic SPD +30% on water terrain
phase:    { max_actions_per_phase: 200 }                                           # [DEFAULT] hard action cap per phase

class_advantage:                    # attacker has the advantage over defender
  - { attacker: infantry, defender: lancer }
  - { attacker: lancer,   defender: cavalry }
  - { attacker: cavalry,  defender: infantry }
  - { attacker: archer,   defender: flyer,   damage_percent: 50 }
  - { attacker: holy,     defender: monster, damage_percent: 50 }   # per-pair override of advantage_damage_percent

draft:
  roster_size: 6
  fielded: 4
  defender_anchor: true
  steps:
    - { actor: challenger, action: ban,     source: human }
    - { actor: defender,   action: ban,     source: rule_sheet }
    - { actor: challenger, action: protect, source: human }
    - { actor: challenger, action: ban,     source: human }
    - { actor: defender,   action: ban,     source: rule_sheet }

limits:                             # hard caps. null = not enforced yet
  max_tactics: 10
  max_effects_per_skill: 8
  max_skills_per_hero: null
  stat_ceiling: null

# Equipment type standard (Decision 133) [DEFAULT values, scaled to a P = 100 hero]: every item of a type has these flat stat lines; items differ
# only by pp_modifiers and effects. Every type needs an entry (stats left out are 0). Bases stay on HP / ATK / INT / DEF / MDEF; the few other
# stats are type identities that balance against a smaller primary line: dagger CRIT, heavy armor SPD -5, shield GUARD, boots SPD.
equipment_bases:
  sword:       { ATK: 30, DEF: 8 }
  axe:         { ATK: 40 }
  spear:       { ATK: 32, HP: 50 }
  hammer:      { ATK: 34, DEF: 6, MDEF: 6 }
  bow:         { ATK: 32 }
  dagger:      { ATK: 24, CRIT: 10 }
  staff:       { INT: 24, MDEF: 12, HP: 30 }
  tome:        { INT: 34 }
  heavy_armor: { HP: 150, DEF: 22, MDEF: 6, SPD: -5 }
  light_armor: { HP: 100, DEF: 14, MDEF: 10 }
  robe:        { HP: 70, DEF: 6, MDEF: 20 }
  shield:      { HP: 40, DEF: 12, GUARD: 5 }
  gloves:      { ATK: 12 }
  boots:       { HP: 30, SPD: 5 }
  ring:        { INT: 12 }
  amulet:      { MDEF: 14, HP: 20 }
  charm:       { HP: 60 }
  bracelet:    { DEF: 12 }
  earring:     { ATK: 6, INT: 6 }
  cloak:       { DEF: 6, MDEF: 10 }
  belt:        { HP: 40, DEF: 6 }

cost:                               # computed, never authored. All placeholders until the gauntlet calibrates them.
  stat_weights: { HP: 0.1, ATK: 1.0, INT: 1.0, DEF: 0.8, MDEF: 0.8, SPD: 1.2, HIT: 0.5, SKL: 0.5, CRIT: 0.5, GUARD: 0.5, EVA: 0.5 }
  skill_price: 10
  effect_price: 10                  # a blessing effect that is not an unconditional modify_stat (those are priced like stat lines)
  aura_price: 10
  squad_price: 15
  caps: { per_hero: null, protected_or_anchor: null, roster: null }
