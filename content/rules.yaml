# rules.yaml: every tunable constant in one place. The engine and validator read this; nothing is hard-coded elsewhere.
# Values marked "placeholder" are expected to change after batch-simulator testing.

# Damage (design Section 8). No variance. [DEFAULT] pool (designer, 2026-11): damage = (ATK_total - DEF_total) x (1 + DMG bonus% - DMG reduction%).
#   pool             core = max(min_damage, power - defense), power = coef * stat * multiplier (every stat modifier included);
#                    pool = 1 + (class advantage/disadvantage %, pair damage_percent, bonus_vs_class %, bonus_on_terrain %)
#                             - (guard damage_reduction_percent when it activates, reduce_damage %), at least 1 - total_reduction_cap_percent/100;
#                    amount = max(min_damage, floor(core * pool * crit))
#   The older formulas (compare with: npm run batch -- ... --formula=...) multiply the matchup into power, then crit, then guard/reductions
#   multiplicatively (capped), each floored:
#   subtract         base = max(min_damage, power - defense)
#   ratio            base = max(min_damage, power * ratio_k / (ratio_k + defense))           defense ratio_k halves the damage
#   scaled_subtract  base = max(min_damage, power * floor_pct / 100, power - defense * def_weight)   never below floor_pct of power
# hero_hits [DEFAULT 4]: a hero's damage (actives, passives, reactions, item effects; any formula) is multiplied by it at the very end (floored, at
# least min_damage). Squads already sum their 10 soldiers and are unaffected; heals are unaffected. What-if: --hero-hits=N (sim), lists on batch.
damage:   { min_damage: 1, crit_multiplier: 1.5, formula: pool, ratio_k: 100, floor_pct: 20, def_weight: 1, hero_hits: 4 }
guard:    { damage_reduction_percent: 50, total_reduction_cap_percent: 75 }
matchup:  { advantage_damage_percent: 25, advantage_hit: 10, disadvantage_damage_percent: -15 }
timeline: { interval_constant: 1000, min_spd: 5 }                                  # interval = round(constant / max(SPD, min_spd))
pp:       { base_active: 3, base_passive: 3, max: 4 }
board:    { rows: 4, columns: 3, hero_rows: 2 }
stun_pushback_counts: 15            # [DEFAULT] timeline counts a stunned unit's pending action is pushed back (delays_pending_action); a typical interval is ~20-27 counts, so a stun costs a bit over half an action

# hit%   = clamp(HIT + hit_bonus - EVA + (aSKL - dSKL) / skl_divisor, hit_min, hit_max)
# crit%  = clamp(CRIT - defender GUARD + (aSKL - dSKL) / skl_divisor, crit_min, crit_max)
# guard% = clamp(GUARD + dSKL / skl_divisor, guard_min, guard_max)
rolls:    { hit_min: 70, hit_max: 100, crit_min: 0, crit_max: 100, guard_min: 0, guard_max: 75, skl_divisor: 4 }

class_traits: { flyer_melee_eva_bonus: 50, aquatic_water_spd_bonus: 30 }   # percent (Decision 126): flyer EVA x1.5 vs melee hits; aquatic SPD +30% on water terrain
phase:    { max_actions_per_phase: 200 }                                           # [DEFAULT] hard action cap per phase

class_advantage:                    # attacker has the advantage over defender
  - { attacker: infantry, defender: lancer }
  - { attacker: lancer,   defender: cavalry }
  - { attacker: cavalry,  defender: infantry }
  - { attacker: archer,   defender: flyer,   damage_percent: 50 }
  - { attacker: holy,     defender: monster, damage_percent: 50 }   # per-pair override of advantage_damage_percent

draft:
  roster_size: 6
  fielded: 4
  defender_anchor: true
  steps:
    - { actor: challenger, action: ban,     source: human }
    - { actor: defender,   action: ban,     source: rule_sheet }
    - { actor: challenger, action: protect, source: human }
    - { actor: challenger, action: ban,     source: human }
    - { actor: defender,   action: ban,     source: rule_sheet }

limits:                             # hard caps. null = not enforced yet
  max_tactics: 10
  max_effects_per_skill: 8
  max_skills_per_hero: null
  stat_ceiling: null

# Equipment type standard (Decision 133) [DEFAULT values, scaled to a P = 100 hero]: every item of a type has these flat stat lines; items differ
# only by pp_modifiers and effects. Every type needs an entry (stats left out are 0). Bases stay on HP / ATK / INT / DEF / MDEF; the few other
# stats are type identities that balance against a smaller primary line: dagger CRIT, heavy armor SPD -5, shield GUARD, boots SPD.
# Retune (designer 2026-11, Decision 135): weapons carry the big offensive line (sword ATK 150); defensive gear's main line is ~1/3-1/2 of a
# weapon's (light armor DEF 50) but its raw total is a bit higher; defensive accessories about 2x, kept modest, so a high DEF is a deliberate build.
equipment_bases:
  sword:       { ATK: 150, DEF: 24 }
  axe:         { ATK: 200 }
  spear:       { ATK: 160, HP: 150 }
  hammer:      { ATK: 170, DEF: 18, MDEF: 18 }
  bow:         { ATK: 160 }
  dagger:      { ATK: 120, CRIT: 10 }
  staff:       { INT: 120, MDEF: 36, HP: 90 }
  tome:        { INT: 170 }
  heavy_armor: { HP: 220, DEF: 70, MDEF: 15, SPD: -5 }
  light_armor: { HP: 150, DEF: 50, MDEF: 20 }
  robe:        { HP: 100, DEF: 20, MDEF: 60 }
  shield:      { HP: 60, DEF: 25, GUARD: 5 }
  gloves:      { ATK: 50 }
  boots:       { HP: 60, SPD: 5 }
  ring:        { INT: 50 }
  amulet:      { MDEF: 30, HP: 40 }
  charm:       { HP: 120 }
  bracelet:    { DEF: 25 }
  earring:     { ATK: 25, INT: 25 }
  cloak:       { DEF: 12, MDEF: 25 }
  belt:        { HP: 80, DEF: 12 }

# Races and sub-races (Decision 148) [DEFAULT]: `lean` = flat stat deltas applied to base stats (Max HP included), each summing to 0 under
# cost.stat_weights (Decision 112); a sub-race adds its lean to its parent's. `traits` apply by battle time of day (stat lines go through
# the unit's own `race` stacking category; heal_percent raises the heals the unit casts); a sub-race's traits REPLACE its parent's. Human: none.
races:
  elf:       { lean: { SKL: 10, EVA: 10, HP: -100, DEF: -5 },   traits: [{ time: night, stat: EVA, mode: flat, value: 5 }] }
  beastfolk: { lean: { SPD: 5, ATK: 10, INT: -6, MDEF: -10 },  traits: [{ time: night, stat: CRIT, mode: flat, value: 5 }] }
  dwarf:     { lean: { HP: 100, DEF: 5, GUARD: 10, SPD: -10, EVA: -13 }, traits: [{ time: day, stat: GUARD, mode: flat, value: 5 }] }
  dragon:    { lean: { HP: 100, ATK: 10, EVA: -10, SKL: -20 }, traits: [{ time: day, stat: DEF, mode: percent, value: 5 }, { time: day, stat: MDEF, mode: percent, value: 5 }] }
  demon:     { lean: { ATK: 10, INT: 10, DEF: -10, MDEF: -10 }, traits: [{ time: night, stat: ATK, mode: percent, value: 10 }, { time: night, stat: INT, mode: percent, value: 10 }, { time: day, stat: DEF, mode: percent, value: -5 }, { time: day, stat: MDEF, mode: percent, value: -5 }] }
  angel:     { lean: { INT: 10, MDEF: 10, ATK: -10, HP: -100 }, traits: [{ time: day, heal_percent: 10 }, { time: night, stat: ATK, mode: percent, value: -5 }, { time: night, stat: INT, mode: percent, value: -5 }] }
sub_races:
  high_elf:    { lean: { INT: 10, MDEF: 3, ATK: -10, CRIT: -10 }, traits: [{ time: day, stat: SKL, mode: flat, value: 5 }] }
  dark_elf:    { lean: { ATK: 10, CRIT: 10, INT: -3, MDEF: -10 }, traits: [{ time: night, stat: EVA, mode: flat, value: 5 }, { time: night, stat: CRIT, mode: flat, value: 5 }, { time: day, stat: EVA, mode: flat, value: -5 }] }
  werebeast:   { lean: { HP: 60, ATK: 6, SPD: -5, EVA: -6 }, traits: [{ time: night, stat: ATK, mode: percent, value: 10 }, { time: day, stat: ATK, mode: percent, value: -5 }] }
  rabbit_folk: { lean: { SPD: 5, EVA: 12, ATK: -6, HP: -120 }, traits: [{ time: night, stat: EVA, mode: flat, value: 5 }] }

cost:                               # computed, never authored. Weights from T6 in tools/balance-series.ts; SPD and SKL unmeasured, INT/MDEF paired with ATK/DEF.
  stat_weights: { HP: 0.1, ATK: 1.0, INT: 1.0, DEF: 1.0, MDEF: 1.0, SPD: 1.2, HIT: 0.8, SKL: 0.5, CRIT: 0.3, GUARD: 1.0, EVA: 1.0 }
  pp_weights: { active: 25, passive: 10 }   # per +1 PP on an item (pp_modifiers, signed), from T6
  skill_price: 10
  effect_price: 10                  # a blessing effect that is not an unconditional modify_stat (those are priced like stat lines)
  aura_price: 10
  squad_price: 15
  caps: { per_hero: null, protected_or_anchor: null, roster: null }
