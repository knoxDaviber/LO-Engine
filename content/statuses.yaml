# statuses.yaml  (v2: designer answers applied)
# "Turn" = one active skill use by the affected unit. Idle actions and passives do not count.
# source_category: inherit = takes the category of whatever applied it (passive / active / equipment / soldier).
# stacking.unique: unique statuses are exempt from same-category strongest-wins and multiply with everything.
# status_001..003 keep their provisional IDs; they were created because skills referenced statuses with no file.

- id: buff_001
  name: Regen
  description: "Regenerates 30% of Max HP when attacked."
  category: buff
  source_category: inherit
  modifiers: []
  flags: { blocks_debuffs: false, intercepts_death: { enabled: false, revive_hp_percent: 20 }, overrides_targeting: null,
           ignores_tactics: false, prevents_action: false, delays_pending_action: false,
           removes_on_hit: false, prevents_evasion: false, heals_on_hit_percent_max_hp: 30 }
  duration: { unit: affected_unit_actions, count: 1, counts_actions_of: affected, applying_action_counts: false, expires: after_action }
  stacking: { stackable: true, unique: false, on_reapply: extend, max_stacks: null, suppress_weaker: false }
  removal: { removable_by_dispel: true, removed_on_death: true }
  meta: { authored_notes: "Heals per hit taken. Lasts until the target uses an active skill. No max stacks; naturally capped by PP. Reapplication extends by 1 turn." }

- id: buff_002
  name: Immunity
  description: "Grants complete Immunity to all debuffs"
  category: buff
  source_category: inherit
  modifiers: []
  flags: { blocks_debuffs: true, intercepts_death: { enabled: false, revive_hp_percent: 20 }, overrides_targeting: null,
           ignores_tactics: false, prevents_action: false, delays_pending_action: false,
           removes_on_hit: false, prevents_evasion: false, heals_on_hit_percent_max_hp: 0 }
  duration: { unit: affected_unit_actions, count: 1, counts_actions_of: affected, applying_action_counts: false, expires: after_action }
  stacking: { stackable: false, unique: false, on_reapply: refresh, max_stacks: 1, suppress_weaker: true }
  removal: { removable_by_dispel: true, removed_on_death: true }
  meta: { authored_notes: "Affected statistics: ALL." }

- id: buff_003
  name: "Fairy's Grace"
  description: "If the character is about to die, revive them at 20% HP"
  category: buff
  source_category: inherit
  modifiers: []
  flags: { blocks_debuffs: false, intercepts_death: { enabled: true, revive_hp_percent: 20 }, overrides_targeting: null,
           ignores_tactics: false, prevents_action: false, delays_pending_action: false,
           removes_on_hit: false, prevents_evasion: false, heals_on_hit_percent_max_hp: 0 }
  duration: { unit: until_used, count: 1, counts_actions_of: affected, applying_action_counts: false, expires: after_action }
  stacking: { stackable: false, unique: false, on_reapply: refresh, max_stacks: 1, suppress_weaker: true }
  removal: { removable_by_dispel: true, removed_on_death: false }
  meta: { authored_notes: "Lasts until used. A revived unit keeps its pending action." }

- id: buff_004
  name: "DEF UP"
  description: "Increases DEF by 20%"
  category: buff
  source_category: inherit
  modifiers:
    - { stat: DEF, mode: percent, value: 20 }
  flags: { blocks_debuffs: false, intercepts_death: { enabled: false, revive_hp_percent: 20 }, overrides_targeting: null,
           ignores_tactics: false, prevents_action: false, delays_pending_action: false,
           removes_on_hit: false, prevents_evasion: false, heals_on_hit_percent_max_hp: 0 }
  duration: { unit: affected_unit_actions, count: 2, counts_actions_of: affected, applying_action_counts: true, expires: after_action }
  stacking: { stackable: false, unique: false, on_reapply: refresh, max_stacks: 1, suppress_weaker: true }
  removal: { removable_by_dispel: true, removed_on_death: true }
  meta: { authored_notes: "Defensive Strike: the attack that applies it counts as 1 turn, so it effectively lasts 1 further turn." }

