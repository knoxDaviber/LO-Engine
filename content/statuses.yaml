- id: debuff_001
  name: "Defense Down"
  description: "Lower's defense by 20%"
  category: debuff
  source_category: inherit          # Hegemony applies it as passive, Dark Dragon's Dirge as active
  modifiers:
    - { stat: DEF, mode: percent, value: -20 }
  flags: { blocks_debuffs: false, intercepts_death: { enabled: false, revive_hp_percent: 20 }, overrides_targeting: null,
           ignores_tactics: false, prevents_action: false, delays_pending_action: false,
           removes_on_hit: false, prevents_evasion: false, heals_on_hit_percent_max_hp: 0 }
  duration: { unit: affected_unit_actions, count: 2, counts_actions_of: affected, applying_action_counts: false, expires: after_action }
  stacking: { stackable: false, unique: false, on_reapply: refresh, max_stacks: 1, suppress_weaker: true }
  removal: { removable_by_dispel: true, removed_on_death: true }
  meta: { authored_notes: "One debuff identity. Applications from different source categories multiply." }

- id: debuff_002
  name: Confusion
  description: "Units confused don't follow tactics. And may attack allies."
  category: debuff
  source_category: inherit
  modifiers: []
  flags: { blocks_debuffs: false, intercepts_death: { enabled: false, revive_hp_percent: 20 }, overrides_targeting: random_any,
           ignores_tactics: true, prevents_action: false, delays_pending_action: false,
           removes_on_hit: false, prevents_evasion: false, heals_on_hit_percent_max_hp: 0 }
  duration: { unit: affected_unit_actions, count: 1, counts_actions_of: affected, applying_action_counts: false, expires: after_action }
  stacking: { stackable: false, unique: false, on_reapply: refresh, max_stacks: 1, suppress_weaker: true }
  removal: { removable_by_dispel: true, removed_on_death: true }
  meta: { authored_notes: "Lasts until the unit's first active attack. Affected statistic: targeting." }

- id: status_001
  name: Stun
  description: "Delays the target's pending action."
  category: control
  source_category: inherit
  modifiers: []
  flags: { blocks_debuffs: false, intercepts_death: { enabled: false, revive_hp_percent: 20 }, overrides_targeting: null,
           ignores_tactics: false, prevents_action: false, delays_pending_action: true,
           removes_on_hit: false, prevents_evasion: false, heals_on_hit_percent_max_hp: 0 }
  duration: { unit: instant, count: null, counts_actions_of: affected, applying_action_counts: false, expires: after_action }
  stacking: { stackable: false, unique: false, on_reapply: refresh, max_stacks: 1, suppress_weaker: true }
  removal: { removable_by_dispel: false, removed_on_death: true }
  meta: { authored_notes: "Pushes the target's pending action back by rules.stun_pushback_counts timeline counts; no action or PP lost." }

- id: status_002
  name: Berserk
  description: "Increase ATK, INT, SPD by 50%. Lower DEF, MDEF, EVA by 50%"
  category: other
  source_category: inherit
  modifiers:
    - { stat: ATK,  mode: percent, value: 50 }
    - { stat: INT,  mode: percent, value: 50 }
    - { stat: SPD,  mode: percent, value: 50 }
    - { stat: DEF,  mode: percent, value: -50 }
    - { stat: MDEF, mode: percent, value: -50 }
    - { stat: EVA,  mode: percent, value: -50 }
  flags: { blocks_debuffs: false, intercepts_death: { enabled: false, revive_hp_percent: 20 }, overrides_targeting: null,
           ignores_tactics: false, prevents_action: false, delays_pending_action: false,
           removes_on_hit: false, prevents_evasion: false, heals_on_hit_percent_max_hp: 0 }
  duration: { unit: while_condition, count: null, counts_actions_of: affected, applying_action_counts: false, expires: after_action }
  stacking: { stackable: true, unique: true, on_reapply: refresh, max_stacks: 1, suppress_weaker: false }
  removal: { removable_by_dispel: true, removed_on_death: true }
  meta: { authored_notes: "Unique status: multiplies with passive buffs instead of competing with them. Lasts while HP is below 50%." }

- id: status_003
  name: "Dark Dragon's Ire"
  description: "The next hit is guaranteed to land (cannot be evaded). 20% DEF Down."
  category: debuff
  source_category: inherit
  modifiers:
    - { stat: DEF, mode: percent, value: -20 }
  flags: { blocks_debuffs: false, intercepts_death: { enabled: false, revive_hp_percent: 20 }, overrides_targeting: null,
           ignores_tactics: false, prevents_action: false, delays_pending_action: false,
           removes_on_hit: false, prevents_evasion: true, heals_on_hit_percent_max_hp: 0 }
  duration: { unit: until_next_hit, count: 1, counts_actions_of: affected, applying_action_counts: false, expires: after_action }
  stacking: { stackable: true, unique: true, on_reapply: refresh, max_stacks: 1, suppress_weaker: false }
  removal: { removable_by_dispel: true, removed_on_death: true }
  meta: { authored_notes: "Both the guaranteed hit and the 20% DEF Down end after the next hit (designer, v3)." }
